      models:
        - "Claude Opus 5.5 (claude-opus-5-5)"
      framework: "Claude Code"
      tool_setup: >-
        The agent wrote the Lean code, milestone plans and initial documentation, building and
        checking locally. From milestone 7, a write-audit loop (lean-loop) used a mechanical
        gate (full build with warnings as errors, axiom check, banned constructs, protected
        theorem statements) and adversarial audits.
      cost:
        wall_time: "18 to 29 October 2026"
        spend_usd: "not tracked"
        hardware: "local machine (kernel checks of up to about 40 GB of memory)"
      prompting_notes: >-
        The author set the goals and made the decisions recorded in each plan; the agent drafted
        the plans, which the author approved, and implemented them stage by stage.
    - method: agent
      models:
        - "gpt-6-astra at maximum effort (OpenAI Codex)"
        - "OpenAI Codex for submission preparation (exact model identifier not recorded)"
      framework: "OpenAI Codex; lean-loop for the stage audits from milestone 7"
      tool_setup: >-
        Milestones 1-6 were reviewed by Codex, the author passing the messages between Claude
        Code and Codex by hand. From milestone 7 on, adversarial audits
        of every stage through lean-loop: read access to the repository, its own Lean probes in
