# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml v0.4, for the Palomar registry (PLAN-19.md §7).
version: "v0.4"

project:
  name: "Graph isomorphism in quasipolynomial time on a single-tape Turing machine"
  description: >-
    A Lean 4 and Mathlib formalization of Babai's quasipolynomial-time algorithm for graph
    isomorphism, without the classification of finite simple groups, carried down to Turing
    machines. There is a single-tape Turing machine (Mathlib's Turing.TM0) that decides whether
    two simple graphs on n vertices, given in a fixed encoding, are isomorphic within
    2^(c (floor(log2 n) + 1)^8) transitions, and another that within the same bound outputs
    either "not isomorphic" or an isomorphism τ together with generators of a subgroup whose left
    coset by τ is exactly the set of all isomorphisms. The algorithm (Luks's framework,
    Schreier–Sims, Weisfeiler–Leman refinement and the Design Lemma, Split-or-Johnson, local
    certificates and Babai's recursion, with Pyber's analysis in place of the classification),
    its cost in an executed cost model, and its compilation to multi-stack and then single-tape
    machines are all proved in Lean.
  authors:
    - "Troy Lee"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Troy Lee"

classification:
  arxiv: [cs.DS, cs.CC, math.CO, math.GR]
  msc2020: [68Q25, 05C60, 20-08, 20B15, 68V20]

sources:
  - title: "Graph Isomorphism in Quasipolynomial Time"
    authors:
      - "László Babai"
    id: "arXiv:1512.03547"
    type: paper
    location: "https://arxiv.org/abs/1512.03547"
    relationship: adapts
    note: >-
      The algorithm that is formalized. Adapted: the classification of finite simple groups is
      replaced (see the next sources and fidelity.divergences), the running time is proved with
      the exponent 8 of this formalization's own accounting, and the machine model is Mathlib's
      single-tape Turing machine.
  - title: "Fixing the UPCC case of Split-or-Johnson"
    authors:
      - "László Babai"
    type: other
    location: "https://people.cs.uchicago.edu/~laci/upcc-fix.pdf"
    relationship: adapts
    note: >-
      A note of 14 January 2017 correcting the analysis of Split-or-Johnson; the corrected
      procedure is the one formalized (milestone 11).
  - title: "A CFSG-free analysis of Babai's quasipolynomial GI-algorithm"
    authors:
      - "László Pyber"
    id: "arXiv:1605.08266"
    type: paper
    location: "https://arxiv.org/abs/1605.08266"
    relationship: adapts
    note: >-
      Theorem 7 and Lemma 12 give the weak form of the alternating-quotient lemma (for
      k > (log2 n)^5) that replaces the classification of finite simple groups.
  - title: "Graph isomorphisms in quasi-polynomial time"
    authors:
      - "Harald Andrés Helfgott"
      - "Jitendra Bajpai"
      - "Daniele Dona"
    id: "arXiv:1710.04574"
    type: paper
    location: "https://arxiv.org/abs/1710.04574"
    relationship: adapts
    note: >-
      The English version of Helfgott's Séminaire Bourbaki exposé 1125, whose presentation of
      Babai's algorithm the formalization follows for many steps.
  - title: "Isomorphism of graphs of bounded valence can be tested in polynomial time"
    authors:
      - "Eugene M. Luks"
    type: paper
    location: "J. Comput. System Sci. 25 (1982), 42–65"
    relationship: background
    note: >-
      Luks's framework, on which Babai's algorithm builds; the earlier milestones formalize it,
      and its bounded-valence theorem.

related_formalizations: []

status:
  scope: >-
    Formalized and proved: the three advertised theorems (lean/Challenge.lean): the decision
    machine (gi_singleTape), the machine returning the coset of all isomorphisms
    (gi_coset_singleTape), and the injectivity of the coset machine's output encoding
    (cosetWord_injective); and the library behind them, including the algorithm's correctness and
    cost in a cost model, its compilation to multi-stack Turing machines, and the compilation to
    single-tape machines. Not claimed: anything about inputs that encode no pair of graphs; an
    explicit constant c; the best exponent (8 is this formalization's); canonical forms.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

