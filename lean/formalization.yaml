  spend_usd: "not tracked"
  notes: >-
    AI agents wrote and audited the development; the author directed it, made its decisions and
    approved the plans and the advertised statements. The Lean proofs were not reviewed line by
    line by a person. See lean/docs/formalization-notes.md, section 5.

fidelity:
  divergences: >-
    No use of the classification of finite simple groups: the alternating-quotient lemma is used
    in Pyber's weak form (k > (log2 n)^5), and Cameron's theorem on large primitive groups is
    replaced by Babai's argument in his section 13.1 with an elementary transitivity bound. The
    time bound has the exponent 8 of this formalization's accounting and an existential
    constant. Helfgott, Bajpai and Dona obtain exp(O((log n)^3)) with an analysis that uses the
    classification; the classification-free route followed here gives a weaker quasipolynomial
    bound, whose exponent the sources do not compute. The model is Mathlib's single-tape Turing
    machine with fixed encodings of inputs and outputs, not a RAM; nothing is claimed on malformed
    inputs. Canonical forms are not covered.

review:
  status: "agent-reviewed"
  reviewers:
    - "OpenAI Codex (gpt-6-astra at maximum effort), reviews and automated adversarial audits"
  notes: >-
    Milestones 1-6 were reviewed by Codex, the author passing the messages between the agents
    by hand. From milestone 7 on, stages ran through a mechanical gate and adversarial
    Codex audits (89 audit rounds by stage 19e; 57 loops approved, two escalated, two
    abandoned). The remaining stage 19e finding concerned the snapshot reference checker and
    was repaired in submission preparation with regression checks. The statements of record
    were drafted in PLAN-19.md and approved by the author. No human line-by-line review of the
    proofs. Mechanical checks: Lean's kernel, an axiom audit of every declaration, and
    Comparator with independent kernels.

alignment:
  namespace: "GraphIsoPalomar"
  statements:
    - source: "Babai, arXiv:1512.03547: graph isomorphism is decidable in quasipolynomial time"
      lean: "GraphIsoPalomar.gi_singleTape"
      module: "Challenge"
      status: "adapted"
      note: >-
        Stated for Mathlib's single-tape Turing machine with a fixed input encoding, with the
        bound 2^(c (floor(log2 n) + 1)^8) in the number n of vertices, without the
        classification of finite simple groups.
    - source: "Babai, arXiv:1512.03547: the coset of isomorphisms is found in quasipolynomial time"
      lean: "GraphIsoPalomar.gi_coset_singleTape"
      module: "Challenge"
      status: "adapted"
      note: >-
        The machine outputs "not isomorphic", or an isomorphism τ and generators of a subgroup
        whose left coset by τ is exactly the set of all isomorphisms, within the same bound.
    - source: "No counterpart: a property of the output encoding"
      lean: "GraphIsoPalomar.cosetWord_injective"
      module: "Challenge"
      status: "proved"
      note: "The coset machine's output word determines its answer."

acknowledgements: >-
