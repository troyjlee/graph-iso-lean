name: Palomar preflight

on:
  workflow_dispatch:
    inputs:
      authorization_relationship:
        description: Your relationship to the responsible author or maintainer
        required: true
        type: choice
        default: I am a responsible author or maintainer
        options:
          - I am a responsible author or maintainer
          - I have approval from a responsible author or maintainer

permissions:
  contents: read

jobs:
  palomar-preflight:
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@14aa8d6b3c2f14a8540605e37144560b9a00e7e7
    with:
      repository: ${{ github.repository }}
      commit: ${{ github.sha }}
      pipeline_commit: 14aa8d6b3c2f14a8540605e37144560b9a00e7e7
      request_id: graphiso0001
      mode: full
      execution_profile: palomar-standard-v1
      options: >-
        {"project_path":"lean","comparator_config_path":"lean/comparator.json","authorization_relationship":${{ toJSON(inputs.authorization_relationship) }}}
